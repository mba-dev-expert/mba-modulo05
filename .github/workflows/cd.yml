name: CD

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    validate:
        name: Validar build e testes
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 9.0.x

            - name: Restore
              run: dotnet restore TelesEducacao.sln

            - name: Build
              run: dotnet build TelesEducacao.sln --no-restore -c Release

            - name: Test
              run: dotnet test TelesEducacao.sln --no-build -c Release

    build-and-push:
        name: Build e push das imagens Docker
        needs: validate # <--- Impede o envio se o job validate falhar
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - service: auth
                      dockerfile: docker/Dockerfile.auth
                      image: teleseducacao-auth
                    - service: alunos
                      dockerfile: docker/Dockerfile.alunos
                      image: teleseducacao-alunos
                    - service: conteudo
                      dockerfile: docker/Dockerfile.conteudo
                      image: teleseducacao-conteudo
                    - service: pagamentos
                      dockerfile: docker/Dockerfile.pagamentos
                      image: teleseducacao-pagamentos
                    - service: bff
                      dockerfile: docker/Dockerfile.bff
                      image: teleseducacao-bff

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login no Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build e push da imagem
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}
