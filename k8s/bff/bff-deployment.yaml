# Substitua <DOCKERHUB_USERNAME> pelo usuario/organizacao do Docker Hub
# usado no workflow cd.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: teleseducacao
  labels:
    app: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 database 1433; do echo "waiting for database"; sleep 5; done
              until nc -z -w2 rabbitmq 5672; do echo "waiting for rabbitmq"; sleep 5; done
      containers:
        - name: bff
          image: <DOCKERHUB_USERNAME>/teleseducacao-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5035
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:5035"
            - name: AppSettings__AutenticacaoJwksUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppSettings__AutenticacaoJwksUrl
            - name: AppServicesSettings__AuthUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppServicesSettings__AuthUrl
            - name: AppServicesSettings__AlunoUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppServicesSettings__AlunoUrl
            - name: AppServicesSettings__ConteudoUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppServicesSettings__ConteudoUrl
            - name: AppServicesSettings__PagamentoUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppServicesSettings__PagamentoUrl
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5035
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5035
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
