# image: nome/tag canonicos - ver auth/auth-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos
  namespace: teleseducacao
  labels:
    app: pagamentos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pagamentos
  template:
    metadata:
      labels:
        app: pagamentos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5401"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 database 1433; do echo "waiting for database"; sleep 5; done
              until nc -z -w2 rabbitmq 5672; do echo "waiting for rabbitmq"; sleep 5; done
      containers:
        - name: pagamentos
          image: teleseducacao-pagamentos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5401
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:5401"
            - name: AppSettings__AutenticacaoJwksUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppSettings__AutenticacaoJwksUrl
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ConnectionStrings__DefaultConnection_Pagamentos
            - name: MessageQueueConnection__MessageBus
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MessageQueueConnection__MessageBus
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5401
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5401
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
