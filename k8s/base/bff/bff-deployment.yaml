# image: nome/tag canonicos - ver auth/auth-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: teleseducacao
  labels:
    app: bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5035"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        # O BFF nao tem banco nem fila proprios: espera pelas 3 APIs que realmente chama.
        # Se algum client HTTP passar a consumir pagamentos, incluir "pagamentos:5401" aqui.
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 auth 5101; do echo "waiting for auth"; sleep 5; done
              until nc -z -w2 alunos 5201; do echo "waiting for alunos"; sleep 5; done
              until nc -z -w2 conteudo 5301; do echo "waiting for conteudo"; sleep 5; done
      containers:
        - name: bff
          image: teleseducacao-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5035
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:5035"
            - name: AppSettings__AutenticacaoJwksUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppSettings__AutenticacaoJwksUrl
            - name: AppServicesSettings__AuthUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppServicesSettings__AuthUrl
            - name: AppServicesSettings__AlunoUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppServicesSettings__AlunoUrl
            - name: AppServicesSettings__ConteudoUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppServicesSettings__ConteudoUrl
            - name: AppServicesSettings__PagamentoUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppServicesSettings__PagamentoUrl
            - name: CorsSettings__AllowedOrigins__0
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CorsSettings__AllowedOrigins__0
            - name: CorsSettings__AllowedOrigins__1
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CorsSettings__AllowedOrigins__1
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5035
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5035
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
