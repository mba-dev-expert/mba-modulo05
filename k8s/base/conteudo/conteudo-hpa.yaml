apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: conteudo
  namespace: teleseducacao
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: conteudo
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
