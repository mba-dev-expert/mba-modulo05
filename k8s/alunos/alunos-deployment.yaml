# Substitua <DOCKERHUB_USERNAME> pelo usuario/organizacao do Docker Hub
# usado no workflow cd.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alunos
  namespace: teleseducacao
  labels:
    app: alunos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alunos
  template:
    metadata:
      labels:
        app: alunos
    spec:
      containers:
        - name: alunos
          image: <DOCKERHUB_USERNAME>/teleseducacao-alunos:latest
          ports:
            - containerPort: 5201
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:5201"
            - name: AppSettings__AutenticacaoJwksUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AppSettings__AutenticacaoJwksUrl
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ConnectionStrings__DefaultConnection_Alunos
            - name: MessageQueueConnection__MessageBus
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MessageQueueConnection__MessageBus
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5201
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5201
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
